<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dessins</title>
<style>
body {
  --pad: 0.4em;
  --gap: 0.3em;
  --cols: 1;
  margin: 0;
  padding: var(--pad);
  box-sizing: border-box;
  min-height: 100dvh;
  display: flex;
  background-color: #fcfcfc;
  font-family: monospace;
}

.grid {
  margin: auto;
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap);
  width: 100%;
}

.grid img {
  display: block;
  width: 100%;
  /* All 30 drawings share this ratio, so the rows stay even and the cells
     hold their shape before the thumbnails have loaded. */
  aspect-ratio: 15502 / 10925;
  object-fit: cover;
  cursor: pointer;
}

.grid img:hover { opacity: 0.85; }

/* Column count steps with the viewport, 1 up to 6, but only through divisors
   of 30 so every row comes out full. 4 is skipped: it would leave a last row
   of 2 against 7 full ones. That leaves 1, 2, 3, 5, 6. Thresholds keep the
   thumbnails at a usable size rather than dividing the width evenly. */
@media (min-width: 380px) { body { --cols: 2; } }
@media (min-width: 520px) { body { --cols: 3; } }
@media (min-width: 900px) { body { --cols: 5; } }

@media (min-width: 1080px) {
  body { --cols: 6; --pad: 1em; --gap: 0.6em; }

  /* At 6 columns the set is 6x5, which is the one arrangement that can fit a
     laptop screen whole. Cap the width at the widest 6x5 whose height still
     clears the viewport, so it never scrolls: for a grid of width W the five
     rows come to (W - 5*gap) / 6 / 1.4189 * 5 + 4*gap, and solving that
     against the available height gives the expression below. Wider monitors
     stop at 1800px so the drawings don't become billboards. */
  .grid {
    max-width: min(
      1800px,
      calc((100dvh - 2 * var(--pad) - 4 * var(--gap)) * 1.7027 + 5 * var(--gap))
    );
  }
}

#viewer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #fcfcfc;
}
#viewer-overlay.active { display: flex; flex-direction: column; }

#viewer-bar {
  display: flex;
  justify-content: flex-end;
  padding: 0.4em 1em;
  border-bottom: 1px solid #e0e0e0;
  flex-shrink: 0;
}

#viewer-bar button {
  background: none;
  border: none;
  font-family: monospace;
  font-size: 14px;
  color: #286c44;
  cursor: pointer;
  padding: 0.2em 0.6em;
}
#viewer-bar button:hover { color: #111; }

#viewer-nav {
  display: flex;
  gap: 0.4em;
  align-items: center;
}
#viewer-nav .counter {
  font-variant-numeric: tabular-nums;
  min-width: 4em;
  text-align: center;
  color: #999;
  font-size: 13px;
}

#osd-container {
  flex: 1;
  min-height: 0;
  width: 100%;
}

.error { padding: 2em; color: #900; }
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<div id="viewer-overlay">
  <div id="viewer-bar">
    <div id="viewer-nav">
      <button id="btn-prev">←</button>
      <span class="counter" id="viewer-counter"></span>
      <button id="btn-next">→</button>
      <button id="btn-close">✕</button>
    </div>
  </div>
  <div id="osd-container"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
<script>
(function () {
  var manifest = [];
  var viewer = null;
  var currentIndex = -1;

  fetch('manifest.json')
    .then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
      return r.json();
    })
    .then(function (data) {
      manifest = data;
      console.log('Manifest loaded:', manifest.length, 'items');
      buildGrid();
    })
    .catch(function (err) {
      document.getElementById('grid').innerHTML =
        '<p class="error">Erreur : ' + err.message + '</p>';
    });

  function buildGrid() {
    var col = document.getElementById('grid');
    for (var i = 0; i < manifest.length; i++) {
      (function (idx) {
        var img = document.createElement('img');
        img.src = manifest[idx].thumb;
        img.alt = manifest[idx].id;
        img.loading = 'lazy';
        img.addEventListener('click', function () { openViewer(idx); });
        col.appendChild(img);
      })(i);
    }
  }

  function openViewer(index) {
    var overlay = document.getElementById('viewer-overlay');
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    // Wait for layout before creating/using OpenSeadragon
    requestAnimationFrame(function () {
      if (!viewer) {
        viewer = OpenSeadragon({
          id: 'osd-container',
          prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/images/',
          showNavigationControl: false,
          showNavigator: false,
          animationTime: 0.3,
          blendTime: 0.1,
          minZoomImageRatio: 0.8,
          maxZoomPixelRatio: 4,
          gestureSettingsMouse: { scrollToZoom: true, clickToZoom: true, dblClickToZoom: true },
          gestureSettingsTouch: { pinchToZoom: true, flickEnabled: true },
        });
        viewer.addHandler('open-failed', function (e) {
          console.error('OpenSeadragon open failed:', e);
        });
      }
      loadImage(index);
    });
  }

  // The tiles on disk form a "tile-grid" pyramid: levels are halved until the
  // image fits in a single 256px tile (~level 6 here), rather than the standard
  // Deep Zoom "pixel" pyramid that halves all the way down to 1px (level 14 for
  // these 15502px images). Reading the .dzi directly makes OpenSeadragon request
  // non-existent levels (7-14) and the viewer stays blank. Build a custom tile
  // source that remaps OpenSeadragon's level numbers onto the stored ones and
  // skips the levels that were never generated.
  var TILE_SIZE = 256;
  var TILE_OVERLAP = 1;

  function makeTileSource(item) {
    var base = item.dzi.replace(/\.dzi$/, '') + '_files';
    var width = item.width;
    var height = item.height;
    var maxLevel = Math.ceil(Math.log2(Math.max(width, height)));
    var diskTop = Math.ceil(Math.log2(Math.max(
      Math.ceil(width / TILE_SIZE),
      Math.ceil(height / TILE_SIZE)
    )));
    var offset = maxLevel - diskTop; // levels not stored on disk

    return {
      width: width,
      height: height,
      tileSize: TILE_SIZE,
      tileOverlap: TILE_OVERLAP,
      minLevel: offset,
      maxLevel: maxLevel,
      getTileUrl: function (level, x, y) {
        return base + '/' + (level - offset) + '/' + x + '_' + y + '.webp';
      }
    };
  }

  function loadImage(index) {
    if (index < 0 || index >= manifest.length) return;
    currentIndex = index;
    document.getElementById('viewer-counter').textContent =
      (index + 1) + '\u2009/\u2009' + manifest.length;

    var item = manifest[index];
    console.log('Opening image:', item.id);
    viewer.open(makeTileSource(item));
  }

  function closeViewer() {
    document.getElementById('viewer-overlay').classList.remove('active');
    document.body.style.overflow = '';
    if (viewer) viewer.close();
    currentIndex = -1;
  }

  function nav(d) {
    var n = currentIndex + d;
    if (n >= 0 && n < manifest.length) loadImage(n);
  }

  document.getElementById('btn-close').addEventListener('click', closeViewer);
  document.getElementById('btn-prev').addEventListener('click', function () { nav(-1); });
  document.getElementById('btn-next').addEventListener('click', function () { nav(1); });
  document.addEventListener('keydown', function (e) {
    if (currentIndex < 0) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') nav(-1);
    else if (e.key === 'ArrowRight') nav(1);
  });
})();
</script>
</body>
</html>
